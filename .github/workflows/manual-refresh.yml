# On-demand news refresh. Triggered by:
#  - the maintainer from the GitHub Actions tab ("Run workflow"), or
#  - the optional refresh relay (refresh-proxy/) behind the website's Refresh button,
#    which calls workflow_dispatch with a token stored only in the relay.
name: Manual refresh

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-news]

concurrency:
  group: steelscope-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      trigger: manual
    secrets: inherit
